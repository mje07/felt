name: build

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true
      - name: Engine tests (incl. exhaustive 7-card evaluator check)
        working-directory: packages/poker_engine
        run: |
          dart pub get
          dart analyze
          dart test
          dart test --run-skipped -t slow
          dart run tool/simulate.dart --hands 50000
      - name: Relay server tests
        working-directory: server/relay
        run: |
          dart pub get
          dart analyze
          dart test
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            output: build/windows/x64/runner/Release
          - os: ubuntu-latest
            target: linux
            output: build/linux/x64/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true
      - name: Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - run: flutter build ${{ matrix.target }} --release
      - uses: actions/upload-artifact@v7
        with:
          name: felt-${{ matrix.target }}
          path: ${{ matrix.output }}
