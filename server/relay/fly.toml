# Fly.io config for the Felt relay (a paid host; Render is free, see README).
# Change `app` to a name of your own,
# then run `fly launch --copy-config` and `fly deploy` from this folder.
app = "felt-relay"
primary_region = "iad"

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 400
    hard_limit = 500

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
